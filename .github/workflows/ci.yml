name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pruebas:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar el proyecto y sus dependencias de desarrollo
        run: pip install -e ".[dev]"

      - name: Instalar el navegador de Playwright
        run: playwright install --with-deps chromium

      - name: Ejecutar pytest (núcleo y pruebas de interfaz)
        run: pytest -v
